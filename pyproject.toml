[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-v41-mac-stream"
version = "0.1.0"
description = "Bounded-memory DeepSeek V4.1 Flash SSD streaming for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "tokenizers==0.23.2",
  "transformers==5.17.0",
]

[project.scripts]
dsv41-mac = "deepseek_v41_mlx.native_stream:main"
dsv41-mac-info = "deepseek_v41_mlx.hardware:main"

[tool.setuptools.packages.find]
include = ["deepseek_v41_mlx*"]
